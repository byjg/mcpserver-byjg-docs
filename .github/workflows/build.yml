name: Build

on:
  push:
    branches: [ main ]
    # Publish semver tags as releases.
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  IMAGE_NAME: byjg/mcpserver-byjg-docs

jobs:
  Test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync

      # Fully offline: a hash-based embedder stands in for Ollama.
      - name: Run tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest -v

  Build:
    runs-on: ubuntu-latest
    needs: [Test]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log into registry
        if: github.event_name == 'push' || github.event.inputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}

      # main -> latest; a tag -> the tag itself
      - uses: actions/github-script@v9
        id: normalized
        with:
          script: |
            tags = `${{ steps.meta.outputs.tags }}`
            result = []
            tags.split("\n").forEach(function (item) {
              short_tag = item.trim().split(":")[1];
              if (short_tag == "master" || short_tag == "main") {
                result.push("${{ env.IMAGE_NAME }}:latest");
              } else if (short_tag != "latest") {
                result.push("${{ env.IMAGE_NAME }}:" + short_tag);
              }
            })
            return result.join(",");
          result-encoding: string

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.normalized.outputs.result }}
          labels: ${{ steps.meta.outputs.labels }}

  Documentation:
    if: github.ref == 'refs/heads/main'
    needs: Build
    uses: byjg/byjg.github.io/.github/workflows/add-doc.yaml@master
    with:
      folder: ai
      project: ${{ github.event.repository.name }}
    secrets:
      DOC_TOKEN: ${{ secrets.DOC_TOKEN }}
