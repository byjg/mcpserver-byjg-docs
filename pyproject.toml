[project]
name = "byjg-docs-mcp"
version = "0.1.0"
description = "MCP server for semantic search over the ByJG documentation corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
byjg-docs-mcp = "byjg_docs_mcp.server:main"
byjg-docs-index = "byjg_docs_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/byjg_docs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# lets test modules import shared helpers from conftest.py by name
pythonpath = ["tests"]
