<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" role="img"
     aria-label="Data flow: the write path indexes markdown into the store; the read path answers MCP queries. Both meet at the embedder and the store.">
  <style>
    
    
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 8; }
    .wbox { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; rx: 8; }
    .rbox { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; rx: 8; }
    .sbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; rx: 8; }
    .t  { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s  { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #656d76; }
    .mono { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #656d76; }
    .hdr { font: 700 12px system-ui, sans-serif; letter-spacing: .08em; }
    .wl { stroke: #0969da; }
    .rl { stroke: #8250df; }
    .flow { fill: none; stroke-width: 2; }
  
    .fg-read { fill: #8250df; }
    .fg-shared { fill: #1a7f37; }
    .fg-write { fill: #0969da; }
    .sk-shared { stroke: #1a7f37; }
    @media (prefers-color-scheme: dark) {
    .sk-shared { stroke: #3fb950; }
    .bg { fill: #0d1117; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; }
    .wbox { fill: #121d2f; stroke: #4493f8; stroke-width: 1.5; rx: 8; }
    .rbox { fill: #1d1526; stroke: #b87fff; stroke-width: 1.5; rx: 8; }
    .sbox { fill: #0f2417; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
    .t  { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6edf3; }
    .s  { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8b949e; }
    .mono { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8b949e; }
    .wl { stroke: #4493f8; }
    .rl { stroke: #b87fff; }
    .fg-read { fill: #b87fff; }
    .fg-shared { fill: #3fb950; }
    .fg-write { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="fg-write"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="fg-shared"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="fg-read"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="700"/>

  <text class="hdr fg-write" x="220" y="30" text-anchor="middle">WRITE PATH</text>
  <text class="hdr fg-read" x="660" y="30" text-anchor="middle">READ PATH</text>

  <!-- write column -->
  <rect class="box" x="100" y="50" width="240" height="52"/>
  <text class="t" x="220" y="72" text-anchor="middle">Docs tree</text>
  <text class="mono" x="220" y="90" text-anchor="middle">byjg.github.io/docs/**.md</text>

  <path class="flow wl" d="M 220 102 L 220 148" marker-end="url(#aw)"/>

  <rect class="wbox" x="100" y="150" width="240" height="62"/>
  <text class="t" x="220" y="172" text-anchor="middle">Indexer</text>
  <text class="s" x="220" y="190" text-anchor="middle">walk · hash · skip unchanged</text>
  <text class="s" x="220" y="205" text-anchor="middle">drop deleted files</text>

  <path class="flow wl" d="M 220 212 L 220 258" marker-end="url(#aw)"/>

  <rect class="wbox" x="100" y="260" width="240" height="62"/>
  <text class="t" x="220" y="282" text-anchor="middle">Chunking</text>
  <text class="s" x="220" y="300" text-anchor="middle">split on headings, keep the</text>
  <text class="s" x="220" y="315" text-anchor="middle">heading path</text>

  <!-- read column -->
  <rect class="box" x="540" y="50" width="240" height="52"/>
  <text class="t" x="660" y="72" text-anchor="middle">MCP client</text>
  <text class="s" x="660" y="90" text-anchor="middle">Claude, or any MCP host</text>

  <path class="flow rl" d="M 660 102 L 660 148" marker-end="url(#ar)"/>

  <rect class="rbox" x="540" y="150" width="240" height="62"/>
  <text class="t" x="660" y="172" text-anchor="middle">Server</text>
  <text class="mono" x="660" y="191" text-anchor="middle">search_docs · get_document</text>
  <text class="mono" x="660" y="206" text-anchor="middle">list_projects</text>

  <!-- converge into embedder -->
  <path class="flow wl" d="M 220 322 L 220 360 Q 220 372 232 372 L 300 372" marker-end="url(#aw)"/>
  <path class="flow rl" d="M 660 212 L 660 360 Q 660 372 648 372 L 580 372" marker-end="url(#ar)"/>

  <rect class="sbox" x="300" y="345" width="280" height="72"/>
  <text class="t" x="440" y="368" text-anchor="middle">Embedder</text>
  <text class="s" x="440" y="386" text-anchor="middle">Ollama · nomic-embed-text · 768d</text>
  <text class="mono" x="440" y="404" text-anchor="middle">search_document: / search_query:</text>

  <path class="flow sk-shared" d="M 440 417 L 440 462" marker-end="url(#as)"/>

  <!-- store -->
  <rect class="box" x="140" y="464" width="600" height="196"/>
  <text class="t" x="440" y="490" text-anchor="middle">VectorStore</text>
  <text class="s" x="440" y="508" text-anchor="middle">SQLite — one 24 MB file</text>

  <rect class="box" x="170" y="524" width="250" height="52"/>
  <text class="t" x="295" y="546" text-anchor="middle">chunks_vec</text>
  <text class="s" x="295" y="564" text-anchor="middle">cosine KNN · sqlite-vec</text>

  <rect class="box" x="460" y="524" width="250" height="52"/>
  <text class="t" x="585" y="546" text-anchor="middle">chunks_fts</text>
  <text class="s" x="585" y="564" text-anchor="middle">BM25 · FTS5</text>

  <rect class="box" x="170" y="592" width="540" height="46"/>
  <text class="t" x="440" y="612" text-anchor="middle">documents (1) · chunks (N)</text>
  <text class="s" x="440" y="629" text-anchor="middle">text, title, heading path, url, category, project</text>
</svg>
